<title>綾Lune 直播间的秘密</title>

<style>
:root{
  --ink:#f2edf6;--muted:#b7a8c4;--rose:#e05678;--panel:rgba(10,8,16,.78);
  --line:rgba(224,86,120,.38);--bg:#0d0a14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{user-select:none}

/* ===== 舞台 ===== */
.stage{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%;opacity:0;transition:opacity .7s ease,filter .55s ease,transform .55s ease;pointer-events:none}
.stage.has-sprite .scene{filter:blur(16px) brightness(.62) saturate(.92);transform:scale(1.12)}
.scene.on{opacity:1}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,8,16,.06) 0%,rgba(8,6,12,.5) 58%,rgba(6,4,10,.94) 100%)}
.red{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 34%,rgba(120,20,40,0) 38%,rgba(120,20,45,.42) 100%);transition:opacity 1.1s ease}
.stage.dark .red{opacity:1}

/* ===== 立绘：等比缩放，桌面靠左、手机居中 ===== */
.sprite{position:absolute;left:0;bottom:0;height:auto;width:auto;max-height:84%;max-width:none;opacity:0;transform:translateY(10px);transition:opacity .55s ease,transform .55s ease;pointer-events:none;filter:drop-shadow(0 14px 36px rgba(0,0,0,.55))}
.sprite.show{opacity:1;transform:translateY(0)}

/* ===== 顶部 HUD ===== */
.hp{position:fixed;top:max(12px,env(safe-area-inset-top));right:64px;z-index:60;font-size:13px;letter-spacing:.12em;color:#ffd7e4;background:rgba(10,8,16,.5);border:1px solid var(--line);border-radius:20px;padding:7px 15px;backdrop-filter:blur(6px);display:none}
.hp.show{display:block}
.hp b{color:var(--rose)}
.sound-btn{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:120;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,16,.58);color:#e9d6f2;backdrop-filter:blur(6px)}
.sound-btn svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;fill:currentColor}
.sound-btn .wav{opacity:0;transition:opacity .2s}
.sound-btn.on{color:var(--rose);border-color:var(--rose)}
.sound-btn.on .wav{opacity:1}

/* ===== 名字 / 对话框 ===== */
.nameplate{position:fixed;left:50%;transform:translateX(-50%);z-index:21;font-size:15px;letter-spacing:.35em;font-weight:700;color:#ffe6ef;background:var(--panel);border:1px solid var(--line);border-bottom:0;padding:7px 22px;border-radius:10px 10px 0 0;backdrop-filter:blur(8px);display:none;bottom:150px}
.nameplate.show{display:block}
.dialogue{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(92%,900px);min-height:112px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px 22px;backdrop-filter:blur(10px);box-shadow:0 10px 44px rgba(0,0,0,.42);cursor:pointer}
#text{font-size:18px;line-height:1.75;letter-spacing:.03em;white-space:pre-line;min-height:3.2em;text-align:left}
.cont{position:absolute;right:16px;bottom:9px;font-size:11px;color:var(--rose);letter-spacing:.28em;opacity:0;transition:opacity .3s}
.cont.show{opacity:1;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}

/* ===== 选项 ===== */
.choices{position:fixed;left:50%;transform:translateX(-50%);z-index:30;width:min(92%,760px);display:none;flex-direction:column;gap:10px;bottom:290px;max-height:60vh;overflow:auto}
.choices.show{display:flex}
.choice{width:100%;min-height:50px;padding:13px 18px;border-radius:12px;border:1px solid rgba(224,86,120,.42);background:rgba(16,10,26,.88);color:var(--ink);font-size:16px;line-height:1.5;text-align:left;transition:background .18s,border-color .18s}
.choice:hover,.choice:focus-visible{background:rgba(224,86,120,.2);border-color:var(--rose);outline:none}

/* ===== 提示 ===== */
.tip{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:rgba(10,8,16,.55);border:1px solid var(--line);color:#e9d6f2;font-size:12px;letter-spacing:.18em;padding:7px 15px;border-radius:20px;opacity:0;transition:opacity .35s;pointer-events:none;backdrop-filter:blur(6px)}
.tip.show{opacity:1}

/* ===== 标题 ===== */
.title{position:fixed;inset:0;z-index:90;background:radial-gradient(ellipse at 50% 28%,#1b1027 0%,#06040a 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px;transition:opacity .6s ease}
.title.gone{opacity:0;pointer-events:none}
.title .sub{font-size:13px;letter-spacing:.46em;color:var(--muted);text-align:center}
.title h1{font-size:clamp(24px,5vw,34px);letter-spacing:.28em;color:#f6e7f0;text-shadow:0 0 26px rgba(224,86,120,.55);font-weight:600;text-align:center}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.btn{min-width:232px;max-width:88vw;padding:14px 34px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#2a1638,#3a1f4a);color:#ffe6ef;letter-spacing:.2em;font-size:16px;transition:background .2s,border-color .2s,transform .12s}
.btn:hover,.btn:focus-visible{background:#45205c;border-color:var(--rose);outline:none}
.btn:active{transform:scale(.985)}
.btn.small{min-width:190px;font-size:14px;padding:11px 24px;letter-spacing:.12em}
.btn.ghost{background:rgba(20,12,30,.62)}
.title .foot{font-size:11px;letter-spacing:.24em;color:var(--muted);margin-top:8px;text-align:center}

/* ===== 结局 ===== */
.ending{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(6,4,10,.55);backdrop-filter:blur(3px)}
.ending.show{display:flex}
.endcard{max-width:min(94%,560px);width:100%;text-align:center;background:rgba(12,9,18,.93);border:1px solid var(--line);border-radius:16px;padding:30px 26px 26px;box-shadow:0 26px 90px rgba(0,0,0,.65)}
.endcard .tag{font-size:12px;letter-spacing:.4em;color:var(--rose);margin-bottom:12px}
.endcard h2{font-size:clamp(20px,4.4vw,26px);letter-spacing:.18em;color:#ffd7e4;font-weight:600;text-shadow:0 0 18px rgba(224,86,120,.45);margin-bottom:14px}
.endcard p{font-size:15px;line-height:1.95;color:#e8d9ef;white-space:pre-line}
.endbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ===== 响应式 ===== */
@media (max-width:640px){
  .sprite{height:54vh;width:96vw;max-height:none;max-width:none;object-fit:cover;object-position:70% bottom;left:50%;transform:translateX(-50%) translateY(10px)}
  .sprite.show{transform:translateX(-50%) translateY(0)}
  #spriteW{object-position:50% top}
}
  #text{font-size:16.5px}
  .dialogue{min-height:104px;padding:13px 16px 20px;border-radius:12px}
  .choice{font-size:15px;min-height:48px;padding:12px 15px}
  .btn{min-width:200px}
}
@media (max-height:520px){
  .sprite{max-height:96%;max-width:52%}
  .dialogue{min-height:86px;padding:10px 14px 16px}
  #text{font-size:16px;min-height:2.6em}
  .choices{max-height:66vh}
}
@media (prefers-reduced-motion:reduce){
  .scene,.sprite,.title,.cont,.red{transition:none!important;animation:none!important}
}
</style>
</head>

<script id="story-data" type="application/json">[{"id":"start","scene":1,"spr":0,"who":"","text":"深夜十一点半，一条冷门的直播推荐把你带进了一个只有三十几个人的直播间。\n画面里，银发的女孩抱着麦克风，一只黑蝙蝠趴在她肩头，懒洋洋地打了个哈欠。","next":"open2"},{"id":"open2","scene":1,"spr":0,"who":"","text":"她唱完最后一句，尾音在安静的房间里飘了一会儿才落下。补光灯把她的睫毛照得很长，弹幕稀稀拉拉地滚过去。","next":"open3"},{"id":"open3","scene":1,"spr":1,"who":"綾Lune","text":"「晚上好呀……今天也有人陪我呢，阿里嘎多。」她把麦克风往怀里收了收，笑起来的时候，声音软软的。","next":"open4"},{"id":"open4","scene":1,"spr":1,"who":"綾Lune","text":"「弹幕我看看哦——」她低头凑近屏幕，忽然顿住，「呀，这个ID，我好像见过你诶。」","next":"open5"},{"id":"open5","scene":1,"spr":0,"who":"","text":"她歪了歪头，肩上的黑蝙蝠也跟着歪了歪脑袋。\n你握着手机，心跳莫名漏了一拍——她怎么会记得你？","next":"open6"},{"id":"open6","scene":1,"spr":0,"who":"","text":"弹幕里没有一个人接话。她却还保持着那个姿势，眼睛一眨不眨地看着镜头，像在等你说点什么。","next":"c1"},{"id":"c1","scene":1,"spr":1,"who":"綾Lune","text":"「那个……」她托着腮，耳朵尖有点红，「要不要，先跟主播说句话呀？就一句，也可以的哦。」","choices":[{"text":"在弹幕里跟她打招呼","hp":2,"next":"c1_a1"},{"text":"默默潜水，把这首听完","hp":0,"next":"c1_b1"}]},{"id":"c1_a1","scene":1,"spr":0,"who":"","text":"你敲下一行\"晚上好，刚才那首歌很好听\"，按下发送。弹幕轻飘飘地滚过去，她却一眼就看见了。","next":"c1_a2"},{"id":"c1_a2","scene":1,"spr":1,"who":"綾Lune","text":"「哇——被夸啦！」她双手合十，笑得眼睛都弯了，「谢谢宝宝，阿里嘎多。今天没白唱呢，哈哈。」","next":"join1"},{"id":"c1_b1","scene":1,"spr":0,"who":"","text":"你把输入框里的字一个个删掉，只把音量调大了一格。\n屏幕那头，她继续唱，唱着唱着，声音忽然轻了一点。","next":"c1_b2"},{"id":"c1_b2","scene":1,"spr":1,"who":"綾Lune","text":"「今天有位观众，从头陪到尾呢。」她对着镜头笑，眼睛弯成月牙，「虽然没说话，但我看见啦。谢谢呀，下次也要来哦。」","next":"join1"},{"id":"join1","scene":1,"spr":0,"who":"","text":"下播前十分钟，她把椅子往前挪了挪，说想再念一遍弹幕。","next":"bridge1"},{"id":"bridge1","scene":1,"spr":1,"who":"綾Lune","text":"「最后再唱一首吧。你们点——」她顿了顿，伸出食指晃了晃，「不过只准点我唱得好的那几首哦，不许刁难主播。」","next":"c2"},{"id":"c2","scene":1,"spr":1,"who":"綾Lune","text":"「来嘛，宝宝，点一首呀。」她抱着麦克风，眼睛亮亮地盯着屏幕，「今天想听什么？」","choices":[{"text":"接她的梗，跟她聊起来","hp":3,"next":"c2_a1"},{"text":"认真夸她，说转音特别好听","hp":2,"next":"c2_b1"},{"text":"打趣：来都来了，投个币呗","hp":1,"next":"c2_c1"}]},{"id":"c2_a1","scene":1,"spr":0,"who":"","text":"你回了一句玩笑：\"那就点一首你唱跑调的。\"\n弹幕瞬间炸开，一排\"哈哈哈哈\"刷了满屏。","next":"c2_a2"},{"id":"c2_a2","scene":1,"spr":1,"who":"綾Lune","text":"「天呐！你、你怎么知道我会跑调呀——」她捂着嘴笑得肩膀发抖，好半天才缓过来，「呜呜，被宝宝抓到把柄啦。」","next":"c2_a3"},{"id":"c2_a3","scene":1,"spr":1,"who":"綾Lune","text":"「不行，这个仇我记下了呢。」她清了清嗓子，故意把第一个音唱歪，然后自己先笑场。\n那半分钟，直播间好像一下子暖了起来。","next":"join2"},{"id":"c2_b1","scene":1,"spr":0,"who":"","text":"你没接梗，只认认真真打下一行字：\"刚才那首，转音的地方特别好听。\"","next":"c2_b2"},{"id":"c2_b2","scene":1,"spr":1,"who":"綾Lune","text":"她盯着那行字看了两秒，耳朵慢慢红了。「……阿里嘎多。」她低头拨了拨琴弦，声音轻下来，「你听得真仔细呢。」","next":"join2"},{"id":"c2_c1","scene":1,"spr":0,"who":"","text":"你半开玩笑地打字：\"主播，来都来了，投个币能点歌吗？\"\n她先是假装板起脸，眉毛都竖起来了。","next":"c2_c2"},{"id":"c2_c2","scene":1,"spr":1,"who":"綾Lune","text":"「哈哈哈，你倒是会做生意呀。」她鼓了鼓腮帮，还是没绷住笑，「行吧，这位老板，这首送你——记得常来哦。」","next":"join2"},{"id":"join2","scene":1,"spr":1,"who":"綾Lune","text":"「好啦，今天的直播就到这里。」她关掉伴奏，冲镜头挥挥手，「晚安呀，宝宝们。」","next":"msg1"},{"id":"msg1","scene":2,"spr":0,"who":"","text":"下播后，你正准备关掉手机，私信栏忽然跳出一个红点。\n头像是一轮细细的月亮。","next":"msg2"},{"id":"msg2","scene":2,"spr":0,"who":"","text":"是綾Lune：「今天谢谢你呀，还没睡吗？」","next":"msg3"},{"id":"msg3","scene":2,"spr":1,"who":"綾Lune","text":"你回了句\"睡不着\"。对面几乎秒回：「那正好，我也睡不着呢。陪我说说话，好不好？」","next":"c3"},{"id":"c3","scene":2,"spr":1,"who":"綾Lune","text":"「我啊……其实每天下播都睡不着呢。」她发来一条语音，背景里只有很轻的电流声，「灯一关，房间就好安静好安静，安静得吓人。」","choices":[{"text":"温柔地接住她的每一句话","hp":4,"next":"c3_a1"},{"text":"适当保持一点距离","hp":1,"next":"c3_b1"},{"text":"略带暧昧地试探一句","hp":3,"next":"c3_c1"}]},{"id":"c3_a1","scene":2,"spr":0,"who":"","text":"你一句一句地回她。她说直播间的压力，说那些没人听她唱歌的晚上，说肩头那只叫\"小蝠\"的黑蝙蝠。","next":"c3_a2"},{"id":"c3_a2","scene":2,"spr":1,"who":"綾Lune","text":"「其实我不太敢跟别人说这些的。」她打字打得很慢，「但是跟你说，好像没关系呢。」","next":"c3_a3"},{"id":"c3_a3","scene":2,"spr":1,"who":"綾Lune","text":"过了很久，她发来一句：「……你真好。」\n隔了几秒，又补上一句：「要是你能一直听我说话，就好了。」","next":"join3"},{"id":"c3_b1","scene":2,"spr":0,"who":"","text":"你回得不快不慢，斟酌着每一句话，连\"早点休息\"都写得客客气气。","next":"c3_b2"},{"id":"c3_b2","scene":2,"spr":1,"who":"綾Lune","text":"「……好呀，那不打扰你啦。」她回得很快，快得像是早就准备好了这句话。\n那个红点安静下去，像一盏被人关掉的灯。","next":"join3"},{"id":"c3_c1","scene":2,"spr":0,"who":"","text":"你半开玩笑地问：\"那我算不算你的特别观众？\"\n输入框上方\"对方正在输入\"亮了又灭，灭了又亮。","next":"c3_c2"},{"id":"c3_c2","scene":2,"spr":1,"who":"綾Lune","text":"「别、别撩我呀……」她发来一个慌乱的系统表情。\n过了一会儿，又补上一句：「……不过，我不讨厌呢。」","next":"join3"},{"id":"join3","scene":2,"spr":0,"who":"","text":"那天之后，你开始留意她开播的时间。\n像是有一根很细的线，把深夜的两端连在了一起。","next":"d0"},{"id":"d0","scene":2,"spr":0,"who":"","text":"几天后，她发来一条直播预告：周末想找个人连麦，一起唱几首歌。","next":"d1"},{"id":"d1","scene":1,"spr":0,"who":"","text":"到了那晚，直播间的人比平时多得多。弹幕刷得飞快，她却一条也没有念。","next":"d1b"},{"id":"d1b","scene":1,"spr":0,"who":"","text":"你在私信里看见她发来两个字：「你来吗？」后面跟着一个小小的月亮表情。","next":"d2"},{"id":"d2","scene":1,"spr":1,"who":"綾Lune","text":"「不着急哦，我等你。」她嘴上这么说，尾音却越拖越短，「要是……你不想来，也没关系的啦。」","next":"c4"},{"id":"c4","scene":1,"spr":1,"who":"綾Lune","text":"屏幕上，连麦的邀请框亮着。她安静地坐在镜头前，手指一下一下地敲着桌面。","choices":[{"text":"答应，为她准备一下","hp":3,"next":"c4_a1"},{"text":"有点犹豫，婉拒了","hp":1,"next":"c4_b1"}]},{"id":"c4_a1","scene":1,"spr":0,"who":"","text":"你答应下来，翻出她唱过的所有歌单，把最喜欢的那几首悄悄练了一遍。","next":"c4_a2"},{"id":"c4_a2","scene":1,"spr":1,"who":"綾Lune","text":"连麦那晚，她唱了一首很温柔的歌给你听。\n结束后她小声问：「下次……还能找你吗？」你说可以，她笑得像偷偷藏了颗糖。","next":"join4"},{"id":"c4_b1","scene":1,"spr":0,"who":"","text":"你回了句\"那天可能有事\"，她的\"正在输入\"亮了很久，最后只发来一句「嗯，我懂的。」","next":"c4_b2"},{"id":"c4_b2","scene":1,"spr":0,"who":"","text":"那晚的连麦，她一个人唱到了最后。\n下播后，她给你发消息的次数，明显少了一些。","next":"join4"},{"id":"join4","scene":1,"spr":0,"who":"","text":"转折发生在一个很平常的晚上。","next":"e1"},{"id":"e1","scene":1,"spr":0,"who":"","text":"你在她的弹幕里随口提了一句别的主播的名字，说那边也在唱歌，\"还挺好听的\"。","next":"e1b"},{"id":"e1b","scene":1,"spr":0,"who":"","text":"弹幕里有人跟着起哄，说\"别家确实更好听\"。她握着麦克风的手，停在了半空。","next":"e2"},{"id":"e2","scene":1,"spr":0,"who":"","text":"弹幕区安静了三秒。\n她低头调了调麦克风，指节在灯光下泛着白。","next":"e3"},{"id":"e3","scene":1,"spr":1,"who":"綾Lune","text":"「……这样啊。」她笑了一下，没有接话，唱完了整首歌。\n声音比平时低了很多。","next":"c5"},{"id":"c5","scene":2,"spr":1,"who":"綾Lune","text":"下播后，她私信你：「你……喜欢看别人的直播吗？」\n句尾没有语气词。那条消息的\"正在输入\"，删删改改了很久。","choices":[{"text":"顺着她，赶紧道歉哄她","hp":3,"next":"c5_a1"},{"text":"觉得气氛不对，想拉开距离","hp":1,"next":"c5_b1"},{"text":"冷静地讲道理：观众是自由的","hp":0,"next":"c5_c1"}]},{"id":"c5_a1","scene":2,"spr":0,"who":"","text":"你立刻道歉，说只是随口一提，屏幕这边你只看着她一个人。","next":"c5_a2"},{"id":"c5_a2","scene":2,"spr":1,"who":"綾Lune","text":"她闷了很久，才回：「……我不许你看别人。」\n过了一会儿又软下来，「只准看我，好不好呀？我、我会一直唱给你听的。」","next":"join5"},{"id":"c5_b1","scene":2,"spr":0,"who":"","text":"你回了句\"别想太多，我只听歌\"，然后把手机扣在桌上。","next":"c5_b2"},{"id":"c5_b2","scene":2,"spr":1,"who":"綾Lune","text":"她安静了很久，久到你以为她睡了，才等来一句：「……好，我知道了。」\n那之后她照常开播，只是不再喊你的ID，也不再主动私信你。","next":"join5"},{"id":"c5_c1","scene":2,"spr":0,"who":"","text":"你认真解释，喜欢听谁唱歌是你的自由，希望她不要多想。","next":"c5_c2"},{"id":"c5_c2","scene":2,"spr":1,"who":"綾Lune","text":"她只回了一个「嗯」。\n可那之后，她的直播间在深夜还亮着灯，却不再喊你的ID了。","next":"join5"},{"id":"join5","scene":1,"spr":0,"who":"","text":"又一场深夜直播。这一次，她没有唱歌。","next":"f1"},{"id":"f1","scene":2,"spr":0,"who":"","text":"下播后，她发来一条语音：「……能留一下吗？我有话想说。」","next":"f2"},{"id":"f2","scene":2,"spr":1,"who":"綾Lune","text":"语音的背景音里，那只黑蝙蝠轻轻叫了一声。「我大概知道，这样不对呢。」她顿了顿。","next":"f3"},{"id":"f3","scene":2,"spr":1,"who":"綾Lune","text":"「可是我一想到你在别人的直播间里，我就……我就唱不下去呀。」她吸了吸鼻子，「对不起，我是不是很奇怪？」","next":"c6"},{"id":"c6","scene":2,"spr":1,"who":"綾Lune","text":"「那你呢？」她沉默了很久，声音轻得像怕惊动什么，「你要怎么选。」","choices":[{"text":"把心意说开，认真面对她","hp":0,"route":"talk","next":"route_talk_1"},{"text":"答应她：以后只来你的直播间","hp":0,"route":"stay","next":"route_stay_1"},{"text":"说一句抱歉，然后退出这场纠缠","hp":0,"route":"flee","next":"route_flee_1"}]},{"id":"route_talk_1","scene":2,"spr":0,"who":"","text":"你深吸一口气，把藏了很久的话一句一句说出口。\n屏幕那头安静得能听见电流的细响。","next":"route_talk_2"},{"id":"route_talk_2","scene":2,"spr":1,"who":"綾Lune","text":"「……你说真的呀？」她的声音有一点发抖，\n「我、我一直以为，只有我一个人在偷偷喜欢呢。」","next":"__ending__"},{"id":"route_stay_1","scene":2,"spr":0,"who":"","text":"你说，以后只来她的直播间。\n她愣了很长一会儿，然后终于笑起来，眼睛弯弯的。","next":"route_stay_2"},{"id":"route_stay_2","scene":2,"spr":1,"who":"綾Lune","text":"「那说好了哦。」她伸出小指，对着镜头晃了晃，\n「拉钩。骗人的话……我会难过的呀。」","next":"__ending__"},{"id":"route_flee_1","scene":2,"spr":0,"who":"","text":"你打下一句\"抱歉\"，然后按灭了屏幕。\n黑暗里，那轮细细的月亮还亮着。","next":"route_flee_2"},{"id":"route_flee_2","scene":2,"spr":0,"who":"","text":"后来你偶尔路过她的直播间，人多了很多，她唱得还是那么好。\n只是弹幕里，她再也没有喊过你的ID。","next":"__ending__"},{"id":"__ending__","final":true}]</script>
<script>
(function(){
  'use strict';

  /* ================= 数据 ================= */
  var ENDINGS = {
    he_own: { tag: 'GOOD END · 专属', title: '「她的专属」', spr: 1, text: '她对你说：「我的直播间，只留你一个人。」\n从此每个夜晚，那束柔和的灯光下，都有一个只唱给你听的声音。' },
    he_talk: { tag: 'GOOD END · 坦白', title: '「说出口的喜欢」', spr: 1, text: '她红着脸，一字一句地说：「我喜欢你，是那种……不想只隔着屏幕的喜欢。」\n你握住她伸来的手，这一次，没有再躲开。' },
    ne_gray: { tag: 'NORMAL END · 若即若离', title: '「若即若离」', spr: 0, text: '你们依旧每天聊几句，却谁都没有再进一步。\n那段暧昧，像她直播间里永远亮着的微光，看得见，摸不着。' },
    ne_miss: { tag: 'NORMAL END · 错过', title: '「错过」', spr: 0, text: '你退出了她的直播间，她也没有再找过你。\n后来你听说，她粉丝涨了很多，只是那些歌，再没有一首是为你唱的。' },
    be_cage: { tag: 'BAD END · 笼中', title: '「她不想放你走」', spr: 1, text: '「既然你问了……」她笑了笑，那笑容让你后背发凉。\n「那我就不放你走了。反正——你只准喜欢我一个，对吧？」' }
  };
  var STORY = JSON.parse(document.getElementById('story-data').textContent);
  var MAP = {};
  for (var i = 0; i < STORY.length; i++) MAP[STORY[i].id] = STORY[i];

  /* ================= 常量与元素 ================= */
  var KEY = 'lune_galgame_v2_save';
  var SKEY = 'lune_galgame_v2_sound';
  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), sc1 = $('sc1'), sc2 = $('sc2'),
      spriteS = $('spriteS'), spriteW = $('spriteW'),
      hpEl = $('hp'), hpValue = $('hpValue'), nameplate = $('nameplate'),
      dialogue = $('dialogue'), textEl = $('text'), cont = $('cont'),
      choicesEl = $('choices'), tip = $('tip'),
      titleEl = $('title'), endingEl = $('ending'),
      endTag = $('endTag'), endTitle = $('endTitle'), endText = $('endText'),
      btnStart = $('btnStart'), btnContinue = $('btnContinue'), btnReset = $('btnReset'),
      btnHome = $('btnHome'), btnAgain = $('btnAgain'), soundBtn = $('soundBtn');

  /* ================= 状态 ================= */
  var state = { node: 'start', hp: 0, route: null, ended: false, choosing: false, typing: false, transitioning: false };
  var typingTimer = null, typingDone = null, typeFull = '', typePos = 0;
  var titleVisible = true, gameActive = false;
  var soundOn = false, actx = null, heartTimer = null, droneNodes = null;
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ================= 声音 ================= */
  function ac() {
    if (!actx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) throw new Error('no audio'); actx = new A(); }
    return actx;
  }
  function tone(freq, peak, dur, type) {
    try {
      var c = ac(); if (c.state === 'suspended') c.resume();
      var t = c.currentTime, o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  function thump(d, p) {
    try {
      var c = ac(); if (c.state === 'suspended') c.resume();
      var t = c.currentTime + d, o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = 58;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.32);
    } catch (e) {}
  }
  function startAmbient() {
    try {
      var c = ac(); if (c.state === 'suspended') c.resume();
      stopAmbient();
      var g = c.createGain(); g.gain.value = 0.028; g.connect(c.destination);
      var o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
      var o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 110.5;
      var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
      o1.connect(lp); o2.connect(lp); lp.connect(g); o1.start(); o2.start();
      droneNodes = [o1, o2];
      heartTimer = setInterval(function () { if (!soundOn) return; thump(0, 0.09); setTimeout(function () { thump(0.18, 0.06); }, 240); }, 900);
    } catch (e) {}
  }
  function stopAmbient() {
    if (heartTimer) { clearInterval(heartTimer); heartTimer = null; }
    if (droneNodes) { for (var i = 0; i < droneNodes.length; i++) { try { droneNodes[i].stop(); } catch (e) {} } droneNodes = null; }
  }
  function updateSoundUI() {
    soundBtn.classList.toggle('on', soundOn);
    soundBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
  }
  soundBtn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    soundOn = !soundOn;
    try { if (soundOn) { ac(); startAmbient(); } else stopAmbient(); } catch (e) { soundOn = false; }
    updateSoundUI();
    try { localStorage.setItem(SKEY, soundOn ? '1' : '0'); } catch (e) {}
  });

  /* ================= 渲染 ================= */
  function setScene(n) { sc1.classList.toggle('on', n === 1); sc2.classList.toggle('on', n === 2); }
  function hideSprites() { spriteS.classList.remove('show'); spriteW.classList.remove('show'); stage.classList.remove('has-sprite'); }
  function setStorySprite(spr) { hideSprites(); if (spr === 1) { spriteS.classList.add('show'); stage.classList.add('has-sprite'); } }
  function setEndingSprite(spr) { hideSprites(); if (spr === 1) spriteW.classList.add('show'); else spriteS.classList.add('show'); stage.classList.add('has-sprite'); }
  function hpRender() { hpValue.textContent = String(state.hp); hpEl.setAttribute('data-hp', String(state.hp)); }
  function hpShow() { hpEl.classList.add('show'); }
  function hpHide() { hpEl.classList.remove('show'); }
  function setNameplate(who) {
    nameplate.textContent = who || '';
    nameplate.classList.toggle('show', !!who);
    layoutUI();
  }
  function flashTip(s) {
    tip.textContent = s; tip.classList.add('show');
    clearTimeout(tip._t); tip._t = setTimeout(function () { tip.classList.remove('show'); }, 2600);
  }

  function layoutUI() {
    var dh = dialogue.getBoundingClientRect();
    var above = Math.max(0, window.innerHeight - dh.top);
    var npH = nameplate.classList.contains('show') ? nameplate.offsetHeight + 6 : 0;
    nameplate.style.bottom = (above + 4) + 'px';
    choicesEl.style.bottom = (above + npH + 10) + 'px';
    var small = false;
    try { small = window.matchMedia('(max-width: 640px)').matches; } catch (e) {}
    var spriteBottom = small ? Math.max(0, above - 10) : 0;
    spriteS.style.bottom = spriteBottom + 'px';
    spriteW.style.bottom = spriteBottom + 'px';
  }
  if (window.ResizeObserver) { try { new ResizeObserver(layoutUI).observe(dialogue); } catch (e) {} }
  window.addEventListener('resize', layoutUI);

  /* ================= 打字机 ================= */
  function cancelTyping() {
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    state.typing = false; typingDone = null; typeFull = ''; typePos = 0;
  }
  function typeText(s, done) {
    cancelTyping();
    state.typing = true; typeFull = s || ''; typePos = 0; typingDone = done || null;
    textEl.textContent = '';
    cont.classList.remove('show');
    if (reduceMotion || !typeFull.length) { finishTyping(); return; }
    step();
  }
  function step() {
    if (!state.typing) return;
    typingTimer = null;
    typePos++;
    textEl.textContent = typeFull.slice(0, typePos);
    if (soundOn && typePos % 3 === 0) tone(1900, 0.02, 0.012, 'triangle');
    if (typePos >= typeFull.length) { finishTyping(); return; }
    var ch = typeFull.charAt(typePos - 1);
    var delay = 66;
    var code = typeFull.charCodeAt(typePos - 1);
    if (code === 10) delay = 90;
    else if ('，。？！…、；：'.indexOf(ch) !== -1) delay = 220;
    typingTimer = setTimeout(step, delay);
  }
  function finishTyping() {
    if (!state.typing) return;
    if (typingTimer) { clearTimeout(typingTimer); typingTimer = null; }
    typePos = typeFull.length; textEl.textContent = typeFull;
    state.typing = false;
    var d = typingDone; typingDone = null;
    if (d) d();
  }

  /* ================= 选项 ================= */
  function hideChoices() {
    state.choosing = false;
    choicesEl.classList.remove('show');
    choicesEl.textContent = '';
    cont.textContent = '▼';
  }
  function showChoices(list) {
    choicesEl.textContent = '';
    for (var i = 0; i < list.length; i++) {
      (function (c, idx) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'choice';
        b.textContent = c.text;
        b.setAttribute('data-index', String(idx));
        b.addEventListener('click', function (ev) { ev.stopPropagation(); choose(c); });
        choicesEl.appendChild(b);
      })(list[i], i);
    }
    choicesEl.classList.add('show');
    state.choosing = true;
    cont.textContent = '选 择';
    layoutUI();
  }

  /* ================= 节点渲染 ================= */
  function renderNode() {
    var node = MAP[state.node];
    if (!node) { returnToTitle(); return; }
    if (node.final) { doEnding(); return; }
    cancelTyping();
    hideChoices();
    document.body.setAttribute('data-node', state.node);
    document.body.setAttribute('data-hp', String(state.hp));
    if (node.scene) setScene(node.scene);
    setStorySprite(typeof node.spr === 'number' ? node.spr : 1);
    stage.classList.toggle('dark', !!node.dark);
    setNameplate(node.who || '');
    hpShow(); hpRender();
    els_cont_reset();
    var myId = state.node;
    var hasChoices = !!node.choices && node.choices.length > 0;
    state.choosing = hasChoices;
    typeText(node.text || '', function () {
      if (state.node !== myId) return;
      if (hasChoices) showChoices(node.choices);
      else cont.classList.add('show');
    });
  }
  function els_cont_reset() { cont.classList.remove('show'); cont.textContent = '▼'; }

  /* ================= 交互 ================= */
  function advance() {
    if (state.ended || state.transitioning) return;
    if (state.typing) { finishTyping(); return; }
    if (state.choosing) return;
    var node = MAP[state.node];
    if (!node || node.final) return;
    if (node.next === '__ending__') { doEnding(); return; }
    if (node.next) { state.node = node.next; save(); renderNode(); }
  }
  function choose(c) {
    if (!state.choosing || state.ended || state.transitioning) return;
    hideChoices();
    state.hp = Math.max(0, state.hp + (typeof c.hp === 'number' ? c.hp : 0));
    if (c.route) state.route = c.route;
    hpRender();
    if (soundOn) tone(660, 0.05, 0.1);
    state.node = c.next;
    save();
    renderNode();
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (t && t.closest && (t.closest('button') || t.closest('.title') || t.closest('.ending'))) return;
    advance();
  });
  document.addEventListener('keydown', function (ev) {
    if (!gameActive) return;
    var k = ev.key;
    if (k === ' ' || k === 'Enter') { ev.preventDefault(); advance(); return; }
    if (k >= '1' && k <= '3' && state.choosing) {
      var idx = parseInt(k, 10) - 1;
      var buttons = choicesEl.querySelectorAll('.choice');
      if (buttons && buttons[idx]) { ev.preventDefault(); buttons[idx].click(); }
    }
  });

  /* ================= 结局 ================= */
  function computeEnding() {
    if (state.route === 'talk') return state.hp >= 10 ? ENDINGS.he_talk : ENDINGS.be_cage;
    if (state.route === 'stay') return state.hp >= 9 ? ENDINGS.he_own : ENDINGS.ne_gray;
    return ENDINGS.ne_miss;
  }
  function doEnding() {
    if (state.transitioning) return;
    state.transitioning = true;
    cancelTyping(); hideChoices();
    stage.classList.add('dark');
    setTimeout(function () {
      var e = computeEnding();
      setScene(2);
      setEndingSprite(e.spr);
      endTag.textContent = e.tag; endTitle.textContent = e.title; endText.textContent = e.text;
      endingEl.classList.add('show');
      state.ended = true; state.transitioning = false; gameActive = false;
      save();
      if (soundOn) { thump(0, 0.2); setTimeout(function () { thump(0.18, 0.14); }, 220); }
    }, reduceMotion ? 0 : 900);
  }

  /* ================= 存档 ================= */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 2, node: state.node, hp: state.hp, route: state.route, ended: state.ended, ts: Date.now() })); } catch (e) {}
  }
  function loadSave() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s || s.v !== 2 || typeof s.node !== 'string') return null;
      if (s.node === '__ending__') return s;
      if (!MAP[s.node]) return null;
      return s;
    } catch (e) { return null; }
  }

  /* ================= 流程 ================= */
  function hideTitle() {
    titleVisible = false;
    titleEl.classList.add('gone');
    setTimeout(function () { if (!titleVisible) titleEl.style.display = 'none'; }, 650);
  }
  function showTitle() {
    titleVisible = true; gameActive = false;
    titleEl.style.display = 'flex';
    requestAnimationFrame(function () { titleEl.classList.remove('gone'); });
    updateTitleButtons();
  }
  function updateTitleButtons() {
    var sv = loadSave();
    btnContinue.style.display = sv ? '' : 'none';
    btnReset.style.display = sv ? '' : 'none';
  }
  function resetUiForGame() {
    endingEl.classList.remove('show');
    stage.classList.remove('dark');
    hpRender();
    hpHide();
    hideSprites();
    setNameplate('');
    cancelTyping(); hideChoices();
    cont.classList.remove('show');
    textEl.textContent = '';
  }
  function newGame() {
    state = { node: 'start', hp: 0, route: null, ended: false, choosing: false, typing: false, transitioning: false };
    try { localStorage.removeItem(KEY); } catch (e) {}
    beginGame();
    flashTip('点击推进剧情');
  }
  function beginGame() {
    resetUiForGame();
    hideTitle();
    gameActive = true;
    renderNode();
  }
  function continueGame() {
    var sv = loadSave();
    if (!sv) { newGame(); return; }
    state = { node: sv.node, hp: sv.hp || 0, route: sv.route || null, ended: !!sv.ended, choosing: false, typing: false, transitioning: false };
    resetUiForGame();
    hideTitle();
    gameActive = !state.ended;
    renderNode();
  }
  function returnToTitle() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    state = { node: 'start', hp: 0, route: null, ended: false, choosing: false, typing: false, transitioning: false };
    gameActive = false;
    endingEl.classList.remove('show');
    stage.classList.remove('dark');
    hideSprites(); setNameplate('');
    hpHide(); cancelTyping(); hideChoices(); cont.classList.remove('show');
    textEl.textContent = '';
    setScene(0);
    showTitle();
  }

  btnStart.addEventListener('click', newGame);
  btnReset.addEventListener('click', newGame);
  btnContinue.addEventListener('click', continueGame);
  btnHome.addEventListener('click', returnToTitle);
  btnAgain.addEventListener('click', newGame);

  /* ================= 启动 ================= */
  (function boot() {
    // story data sanity
    if (!STORY || !STORY.length || !MAP['start']) {
      textEl.textContent = '剧情数据加载失败。';
      return;
    }
    try { soundOn = localStorage.getItem(SKEY) === '1'; } catch (e) {}
    updateSoundUI();
    updateTitleButtons();
    setScene(0);
    // 首次交互时恢复音效
    if (soundOn) {
      document.addEventListener('pointerdown', function once() {
        document.removeEventListener('pointerdown', once);
        try { ac(); startAmbient(); } catch (e) {}
      });
    }
    // 暴露给自动化测试/调试
    window.LUNE_DEBUG = {
      getState: function () { return state; },
      story: STORY, endings: ENDINGS, map: MAP
    };
  })();
})();
</script>
