<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a14">
<meta property="og:title" content="綾Lune 直播间的秘密">
<meta property="og:description" content="深夜直播间里，主播綾Lune 与你之间的五段结局。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://fengyedgspe.github.io/lune-galgame/">
<meta property="og:image" content="https://fengyedgspe.github.io/lune-galgame/assets/scene_clean.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="深夜直播间里，主播綾Lune 与你之间的五段结局。（本作仅为作者自娱自乐，请勿当真）">
<title>綾Lune 直播间的秘密</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z' fill='%23e05678'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#f2edf6;--muted:#b7a8c4;--rose:#e05678;--panel:rgba(10,8,16,.88);
  --line:rgba(224,86,120,.38);--bg:#0d0a14;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{user-select:none}

/* ===== 舞台 ===== */
.stage{position:fixed;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;opacity:0;transition:opacity .5s ease;pointer-events:none}
.stage.has-sprite .scene.on{opacity:0}
.stage::after{content:'';position:absolute;left:0;bottom:0;width:62%;height:42%;pointer-events:none;background:radial-gradient(ellipse at 36% 100%,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 68%);opacity:0;transition:opacity .45s ease;z-index:2}
.stage.has-sprite::after{opacity:1}
.scene.on{opacity:1}
.stage.has-sprite .scene.on{opacity:0}
.ambient{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity .6s ease;pointer-events:none;background:radial-gradient(ellipse at 32% 38%,rgba(96,42,74,.55) 0%,rgba(40,22,48,0) 62%),radial-gradient(ellipse at 76% 28%,rgba(34,44,92,.45) 0%,rgba(20,16,32,0) 58%),linear-gradient(160deg,#181022 0%,#0d0a16 55%,#07050c 100%)}
.stage.has-sprite .ambient{opacity:1}
.stage.scene2 .ambient{background:radial-gradient(ellipse at 68% 36%,rgba(104,40,72,.5) 0%,rgba(40,20,44,0) 60%),radial-gradient(ellipse at 24% 70%,rgba(40,36,84,.35) 0%,rgba(16,12,26,0) 55%),linear-gradient(170deg,#1a1020 0%,#0d0912 60%,#07050a 100%)}
.veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,8,16,.06) 0%,rgba(8,6,12,.5) 58%,rgba(6,4,10,.94) 100%)}
.red{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 34%,rgba(120,20,40,0) 38%,rgba(120,20,45,.42) 100%);transition:opacity 1.1s ease}
.stage.dark .red{opacity:1}

/* ===== 立绘：等比缩放，桌面靠左、手机居中 ===== */
.sprite{position:absolute;left:2%;bottom:0;height:auto;width:auto;max-height:82%;max-width:none;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;z-index:3}
.sprite.show{opacity:1;transform:translateY(0)}

/* ===== 顶部 HUD ===== */
.hp{position:fixed;top:max(12px,env(safe-area-inset-top));right:64px;z-index:60;font-size:13px;letter-spacing:.12em;color:#ffd7e4;background:rgba(10,8,16,.62);border:1px solid var(--line);border-radius:20px;padding:7px 15px;;display:none}
.hp.show{display:block}
.hp b{color:var(--rose)}
.sound-btn{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:120;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,16,.68);color:#e9d6f2;}
.sound-btn svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;fill:currentColor}
.sound-btn .wav{opacity:0;transition:opacity .2s}
.sound-btn.on{color:var(--rose);border-color:var(--rose)}
.sound-btn.on .wav{opacity:1}

/* ===== 名字 / 对话框 ===== */
.nameplate{position:fixed;left:50%;transform:translateX(-50%);z-index:21;font-size:15px;letter-spacing:.35em;font-weight:700;color:#ffe6ef;background:var(--panel);border:1px solid var(--line);border-bottom:0;padding:7px 22px;border-radius:10px 10px 0 0;;display:none;bottom:150px}
.nameplate.show{display:block}
#dialogue:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.dialogue{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(92%,900px);min-height:112px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 20px 22px;;box-shadow:0 10px 44px rgba(0,0,0,.42);cursor:pointer}
#text{font-size:18px;line-height:1.75;letter-spacing:.03em;white-space:pre-line;min-height:3.2em;text-align:left}
.cont{position:absolute;right:16px;bottom:9px;font-size:11px;color:var(--rose);letter-spacing:.28em;opacity:0;transition:opacity .3s}
.cont.show{opacity:1;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.18}}

/* ===== 选项 ===== */
.choices{position:fixed;left:50%;transform:translateX(-50%);z-index:30;width:min(92%,760px);display:none;flex-direction:column;gap:10px;bottom:290px;max-height:60vh;overflow:auto}
.choices.show{display:flex}
.choice{width:100%;min-height:50px;padding:13px 18px;border-radius:12px;border:1px solid rgba(224,86,120,.42);background:rgba(16,10,26,.88);color:var(--ink);font-size:16px;line-height:1.5;text-align:left;transition:background .18s,border-color .18s}
.choice:hover,.choice:focus-visible{background:rgba(224,86,120,.2);border-color:var(--rose);outline:none}

/* ===== 提示 ===== */
.tip{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;background:rgba(10,8,16,.66);border:1px solid var(--line);color:#e9d6f2;font-size:12px;letter-spacing:.18em;padding:7px 15px;border-radius:20px;opacity:0;transition:opacity .35s;pointer-events:none;}
.tip.show{opacity:1}

/* ===== 标题 ===== */
.title{position:fixed;inset:0;z-index:90;background:radial-gradient(ellipse at 50% 28%,#1b1027 0%,#06040a 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px;transition:opacity .6s ease}
.title.gone{opacity:0;pointer-events:none}
.title .sub{font-size:13px;letter-spacing:.46em;color:var(--muted);text-align:center}
.title h1{font-size:clamp(24px,5vw,34px);letter-spacing:.28em;color:#f6e7f0;text-shadow:0 0 26px rgba(224,86,120,.55);font-weight:600;text-align:center}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.btn{min-width:232px;max-width:88vw;padding:14px 34px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(135deg,#2a1638,#3a1f4a);color:#ffe6ef;letter-spacing:.2em;font-size:16px;transition:background .2s,border-color .2s,transform .12s}
.btn:hover,.btn:focus-visible{background:#45205c;border-color:var(--rose);outline:none}
.btn:active{transform:scale(.985)}
.btn.small{min-width:190px;font-size:14px;padding:11px 24px;letter-spacing:.12em}
.btn.ghost{background:rgba(20,12,30,.62)}
.title .foot{font-size:11px;letter-spacing:.24em;color:var(--muted);margin-top:8px;text-align:center}

/* ===== 结局 ===== */
.ending{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(6,4,10,.6)}
.ending.show{display:flex}
.endcard{max-width:min(94%,560px);width:100%;max-height:88vh;overflow:auto;text-align:center;background:rgba(12,9,18,.93);border:1px solid var(--line);border-radius:16px;padding:30px 26px 26px;box-shadow:0 26px 90px rgba(0,0,0,.65)}
.endcard .tag{font-size:12px;letter-spacing:.4em;color:var(--rose);margin-bottom:12px}
.endcard h2{font-size:clamp(20px,4.4vw,26px);letter-spacing:.18em;color:#ffd7e4;font-weight:600;text-shadow:0 0 18px rgba(224,86,120,.45);margin-bottom:14px}
.endcard p{font-size:15px;line-height:1.95;color:#e8d9ef;white-space:pre-line}
.endbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ===== 结局模式：隐藏游戏 HUD/对话框 ===== */
.ending-mode .dialogue,.ending-mode .nameplate,.ending-mode .choices,.ending-mode .tip,.ending-mode .hp,.ending-mode .hud-btn{opacity:0;pointer-events:none;transition:opacity .35s ease}

/* ===== 标题背景 / 后日谈 / 回看选项 ===== */
.title-bg{position:absolute;inset:0;background:url(assets/title_bg_blur.jpg) center 30%/cover no-repeat;opacity:1;z-index:0;pointer-events:none}
.title-shade{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 32%,rgba(20,12,30,.12) 0%,rgba(6,4,10,.8) 82%)}
.title > :not(.title-bg):not(.title-shade){position:relative;z-index:1}
.title::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(2px 2px at 18% 24%,rgba(255,214,232,.55),transparent 60%),radial-gradient(2px 2px at 72% 18%,rgba(255,214,232,.4),transparent 60%),radial-gradient(2px 2px at 84% 62%,rgba(255,214,232,.45),transparent 60%),radial-gradient(2px 2px at 32% 74%,rgba(255,214,232,.35),transparent 60%),radial-gradient(1.5px 1.5px at 55% 42%,rgba(255,214,232,.5),transparent 60%);animation:twinkle 9s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:.95}}
.epilogue{display:none;margin-top:14px;padding-top:12px;border-top:1px solid rgba(224,86,120,.25);font-size:14px;line-height:1.9;white-space:pre-line;color:#e8d9ef;text-align:left}
.epilogue.show{display:block}
.recall-card{text-align:center;padding:4px 2px}
.recall-card .tag{font-size:12px;letter-spacing:.36em;color:var(--rose);margin-bottom:10px}
.recall-card h2{font-size:24px;letter-spacing:.16em;color:#ffd7e4;margin-bottom:12px;font-weight:600}
.recall-card p{font-size:15px;line-height:1.95;white-space:pre-line;color:#e8d9ef}
.recall-card .epilogue{display:block;margin-top:14px;padding-top:12px;text-align:left}
.recall-hint{display:block;font-size:11px;color:var(--rose);letter-spacing:.12em;margin-top:5px}
.cg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .65s ease;z-index:2;pointer-events:none;transform:scale(1)}
.cg-layer.on{opacity:1;animation:cgZoom 9s ease-out both}
@keyframes cgZoom{from{transform:scale(1.05)}to{transform:scale(1)}}
.stage.cg-mode .scene,.stage.cg-mode .ambient{opacity:0}
.reaction{position:fixed;top:66px;right:18px;width:92px;height:92px;object-fit:contain;z-index:70;opacity:0;transform:translateY(10px) scale(.7);transition:opacity .2s ease,transform .28s cubic-bezier(.2,1.5,.4,1);pointer-events:none;filter:drop-shadow(0 8px 20px rgba(0,0,0,.5))}
.reaction.show{opacity:1;transform:translateY(0) scale(1)}
@media (max-width:700px){.reaction{width:72px;height:72px;top:58px;right:12px}}
.chapter{position:fixed;inset:0;z-index:88;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .55s ease;background:radial-gradient(ellipse at 50% 45%,rgba(10,8,16,.92),rgba(6,4,10,.98))}
.chapter.show{opacity:1}
.chapter span{font-size:clamp(20px,3.2vw,30px);letter-spacing:.42em;color:#ffe6ef;text-shadow:0 0 26px rgba(224,86,120,.5);border-top:1px solid rgba(224,86,120,.45);border-bottom:1px solid rgba(224,86,120,.45);padding:18px 34px}
.cg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cg-item{position:relative;border-radius:12px;overflow:hidden;border:1px solid rgba(224,86,120,.32);background:rgba(20,14,30,.85);cursor:pointer;padding:0;text-align:left}
.cg-item img{width:100%;height:130px;object-fit:cover;display:block;opacity:.92}
.cg-item .cap{display:block;padding:8px 10px;font-size:12px;letter-spacing:.1em;color:#ffd7e4}
.cg-item.locked{cursor:default}
.cg-item.locked img{filter:grayscale(1) brightness(.35)}
.cg-item.emoji img{height:96px;object-fit:contain;background:rgba(255,255,255,.035)}
.cg-item.emoji .cap{text-align:center}
.cg-item.locked::after{content:'未解锁';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.3em;color:#e9d6f2;background:rgba(6,4,10,.35)}
.cg-big{margin-top:14px;text-align:center}
.cg-big img{max-width:100%;max-height:46vh;border-radius:12px;border:1px solid rgba(224,86,120,.35)}
.cg-cap{margin-top:8px;font-size:12px;letter-spacing:.18em;color:var(--muted)}
.hist-line.hist-choice b{color:#ffd7e4}
.hist-line.hist-choice p{color:var(--rose)}

/* ===== 菜单 / 弹层 ===== */
.hp{right:116px}
.hud-btn{position:fixed;top:max(12px,env(safe-area-inset-top));right:64px;z-index:120;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(10,8,16,.68);color:#e9d6f2;;display:none;align-items:center;justify-content:center;cursor:pointer}
.hud-btn.show{display:flex}
.hud-btn svg{width:20px;height:20px;fill:currentColor}
.hud-btn.auto{border-color:var(--rose);color:var(--rose)}
.hud-btn.auto::after{content:'AUTO';position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.14em;color:var(--rose)}
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,4,10,.74)}
.modal.show{display:flex}
.panel{width:min(94vw,520px);max-height:86vh;overflow:auto;background:rgba(14,10,20,.97);border:1px solid var(--line);border-radius:16px;padding:22px 22px 16px;box-shadow:0 24px 90px rgba(0,0,0,.62)}
.panel h3{font-size:17px;letter-spacing:.3em;font-weight:600;color:#ffe6ef;margin:0 0 16px;text-align:center}
.menu-grid{display:flex;flex-direction:column;gap:10px}
.menu-grid .row{display:flex;gap:10px}
.menu-grid .row .btn{flex:1;min-width:0;padding:12px 8px;font-size:14px;letter-spacing:.08em}
.settings{display:flex;flex-direction:column;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(224,86,120,.2)}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);letter-spacing:.06em}
.setting select{accent-color:var(--rose);background:rgba(20,14,30,.9);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;min-width:130px}
.setting input[type=range]{accent-color:var(--rose);width:150px}
.hist-list{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;padding-right:4px}
.hist-line{border-left:2px solid rgba(224,86,120,.35);padding-left:10px}
.hist-line b{display:block;font-size:12px;letter-spacing:.2em;color:var(--rose);margin-bottom:3px}
.hist-line p{font-size:14px;line-height:1.7;white-space:pre-line;color:#e8d9ef}
.hist-empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 0}
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid rgba(224,86,120,.32);background:rgba(20,14,30,.85);color:var(--ink);cursor:pointer}
.slot:hover,.slot:focus-visible{border-color:var(--rose);background:rgba(224,86,120,.14);outline:none}
.slot b{font-size:14px;letter-spacing:.14em;color:#ffd7e4}
.slot span{font-size:12px;color:var(--muted);line-height:1.5;white-space:pre-line}
.slot.empty{opacity:.62}
.slot-actions{display:flex;gap:10px;margin-top:16px}
.slot-actions .btn{flex:1;min-width:0}
.toast{position:fixed;top:86px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:300;background:rgba(16,10,26,.95);border:1px solid var(--line);color:#ffe6ef;font-size:13px;letter-spacing:.12em;padding:9px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.title .progress{margin-top:2px;background:none;border:0;color:var(--muted);font-size:11px;letter-spacing:.2em;padding:4px 8px;cursor:pointer}
.disclaimer{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:8px;text-align:center;line-height:1.7;opacity:.85}
.title .progress:hover{color:#ffd7e4}
.endcollect{margin-top:14px;font-size:11px;letter-spacing:.22em;color:var(--muted)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title h1{animation:floaty 6s ease-in-out infinite}
@media (max-width:640px){
  .title-bg{background-position:center 28%}
  .hp{right:104px}
  .hud-btn{right:58px;width:40px;height:40px}
  .sound-btn{right:10px;width:40px;height:40px;top:max(12px,env(safe-area-inset-top))}
  .panel{padding:18px 16px 12px}
  .epilogue{font-size:13px;line-height:1.85}
  .setting select{min-width:110px}
  .setting input[type=range]{width:120px}
}

/* ===== 超大桌面（≥1600px）：再放大一档 ===== */
@media (min-width:1600px){
  .dialogue{width:min(92%,1120px);min-height:150px;padding:24px 30px 32px}
  #text{font-size:22px;line-height:1.85;min-height:3.3em}
  .nameplate{font-size:18px;padding:10px 30px}
  .choices{width:min(92%,940px)}
  .choice{font-size:18px;min-height:62px;padding:18px 26px}
  .title h1{font-size:46px}
  .title .btn{min-width:320px;padding:19px 48px;font-size:19px}
  .title .btn.small{min-width:262px;font-size:16px;padding:14px 32px}
  .title .sub{font-size:15px}
  .panel{width:min(90vw,680px);padding:32px 34px 26px}
  .panel h3{font-size:21px}
  .menu-grid .row .btn{font-size:16px;min-height:56px}
  .slot b{font-size:16px}
  .slot span{font-size:14px}
  .hist-line p{font-size:16px}
  .endcard{max-width:min(92%,680px);padding:40px 38px 34px}
  .endcard h2{font-size:34px}
  .endcard p{font-size:17px}
  .epilogue{font-size:16px}
  .hud-btn,.sound-btn{width:52px;height:52px}
  .hud-btn{right:80px}
  .sound-btn{right:16px}
  .hp{right:142px;font-size:15px}
  .tip{font-size:14px}
}

/* ===== 桌面大屏（≥1100px）：整体放大一档 ===== */
@media (min-width:1100px){
  .dialogue{width:min(94%,1000px);min-height:134px;padding:20px 26px 28px;border-radius:16px}
  #text{font-size:20px;line-height:1.8;letter-spacing:.035em;min-height:3.3em}
  .cont{font-size:12px;right:20px;bottom:11px}
  .nameplate{font-size:17px;padding:9px 26px;letter-spacing:.4em;border-radius:12px 12px 0 0}
  .choices{width:min(94%,840px);gap:12px}
  .choice{font-size:17px;min-height:58px;padding:16px 22px;border-radius:13px}
  .title h1{font-size:40px}
  .title .sub{font-size:14px;letter-spacing:.5em}
  .title .menu{gap:14px}
  .title .btn{min-width:288px;padding:17px 44px;font-size:18px;letter-spacing:.24em;border-radius:14px}
  .title .btn.small{min-width:236px;padding:13px 30px;font-size:15px;letter-spacing:.14em}
  .title .foot{font-size:12px}
  .title .progress{font-size:12px}
  .hud-btn,.sound-btn{width:48px;height:48px}
  .hud-btn svg,.sound-btn svg{width:22px;height:22px}
  .sound-btn{right:14px}
  .hud-btn{right:72px}
  .hp{right:130px;font-size:14px;padding:9px 18px}
  .tip{font-size:13px;padding:8px 18px}
  .panel{width:min(92vw,620px);padding:28px 30px 22px;border-radius:18px}
  .panel h3{font-size:19px;letter-spacing:.34em;margin-bottom:20px}

<script id="story-data" type="application/json">[{"id":"start","scene":1,"spr":0,"who":"","text":"深夜十一点半，一条冷门的直播推荐把你带进了一个只有三十几个人的直播间。\n画面里，银发的女孩抱着麦克风，一只黑蝙蝠趴在她肩头，懒洋洋地打了个哈欠。","next":"open2","chapter":"序章 · 深夜的直播间"},{"id":"open2","scene":1,"spr":0,"who":"","text":"她唱完最后一句，尾音在安静的房间里飘了一会儿才落下。补光灯把她的睫毛照得很长，弹幕稀稀拉拉地滚过去。","next":"open3"},{"id":"open3","scene":1,"spr":1,"who":"綾Lune","text":"「晚上好呀……今天也有人陪我呢，阿里嘎多。」她把麦克风往怀里收了收，笑起来的时候，声音软软的。","next":"open4"},{"id":"open4","scene":1,"spr":1,"who":"綾Lune","text":"「弹幕我看看哦——」她低头凑近屏幕，忽然顿住，「呀，这个ID，我好像见过你诶。」","next":"open5"},{"id":"open5","scene":1,"spr":0,"who":"","text":"她歪了歪头，肩上的黑蝙蝠也跟着歪了歪脑袋。\n你握着手机，心跳莫名漏了一拍——她怎么会记得你？","next":"open6"},{"id":"open6","scene":1,"spr":0,"who":"","text":"弹幕里没有一个人接话。她却还保持着那个姿势，眼睛一眨不眨地看着镜头，像在等你说点什么。","next":"c1","cg":"assets/cg_vod_1.jpg"},{"id":"c1","scene":1,"spr":1,"who":"綾Lune","text":"「那个……」她托着腮，耳朵尖有点红，「要不要，先跟主播说句话呀？就一句，也可以的哦。」","choices":[{"text":"在弹幕里跟她打招呼","hp":2,"next":"c1_a1"},{"text":"默默潜水，把这首听完","hp":0,"next":"c1_b1"}]},{"id":"c1_a1","scene":1,"spr":0,"who":"","text":"你敲下一行\"晚上好，刚才那首歌很好听\"，按下发送。弹幕轻飘飘地滚过去，她却一眼就看见了。","next":"c1_a2"},{"id":"c1_a2","scene":1,"spr":1,"who":"綾Lune","text":"「哇——被夸啦！」她双手合十，笑得眼睛都弯了，「谢谢宝宝，阿里嘎多。今天没白唱呢，哈哈。」","next":"join1"},{"id":"c1_b1","scene":1,"spr":0,"who":"","text":"你把输入框里的字一个个删掉，只把音量调大了一格。\n屏幕那头，她继续唱，唱着唱着，声音忽然轻了一点。","next":"c1_b2"},{"id":"c1_b2","scene":1,"spr":1,"who":"綾Lune","text":"「今天有位观众，从头陪到尾呢。」她对着镜头笑，眼睛弯成月牙，「虽然没说话，但我看见啦。谢谢呀，下次也要来哦。」","next":"join1"},{"id":"join1","scene":1,"spr":0,"who":"","text":"下播前十分钟，她把椅子往前挪了挪，说想再念一遍弹幕。","next":"bridge1"},{"id":"bridge1","scene":1,"spr":1,"who":"綾Lune","text":"「最后再唱一首吧。你们点——」她顿了顿，伸出食指晃了晃，「不过只准点我唱得好的那几首哦，不许刁难主播。」","next":"c2"},{"id":"c2","scene":1,"spr":1,"who":"綾Lune","text":"「来嘛，宝宝，点一首呀。」她抱着麦克风，眼睛亮亮地盯着屏幕，「今天想听什么？」","choices":[{"text":"接她的梗，跟她聊起来","hp":3,"next":"c2_a1"},{"text":"认真夸她，说转音特别好听","hp":2,"next":"c2_b1"},{"text":"打趣：来都来了，投个币呗","hp":1,"next":"c2_c1"}]},{"id":"c2_a1","scene":1,"spr":0,"who":"","text":"你回了一句玩笑：\"那就点一首你唱跑调的。\"\n弹幕瞬间炸开，一排\"哈哈哈哈\"刷了满屏。","next":"c2_a2"},{"id":"c2_a2","scene":1,"spr":1,"who":"綾Lune","text":"「天呐！你、你怎么知道我会跑调呀——」她捂着嘴笑得肩膀发抖，好半天才缓过来，「呜呜，被宝宝抓到把柄啦。」","next":"c2_a3"},{"id":"c2_a3","scene":1,"spr":1,"who":"綾Lune","text":"「不行，这个仇我记下了呢。」她清了清嗓子，故意把第一个音唱歪，然后自己先笑场。\n那半分钟，直播间好像一下子暖了起来。","next":"join2"},{"id":"c2_b1","scene":1,"spr":0,"who":"","text":"你没接梗，只认认真真打下一行字：\"刚才那首，转音的地方特别好听。\"","next":"c2_b2"},{"id":"c2_b2","scene":1,"spr":1,"who":"綾Lune","text":"她盯着那行字看了两秒，耳朵慢慢红了。「……阿里嘎多。」她低头拨了拨琴弦，声音轻下来，「你听得真仔细呢。」","next":"join2"},{"id":"c2_c1","scene":1,"spr":0,"who":"","text":"你半开玩笑地打字：\"主播，来都来了，投个币能点歌吗？\"\n她先是假装板起脸，眉毛都竖起来了。","next":"c2_c2"},{"id":"c2_c2","scene":1,"spr":1,"who":"綾Lune","text":"「哈哈哈，你倒是会做生意呀。」她鼓了鼓腮帮，还是没绷住笑，「行吧，这位老板，这首送你——记得常来哦。」","next":"join2"},{"id":"join2","scene":1,"spr":1,"who":"綾Lune","text":"「好啦，今天的直播就到这里。」她关掉伴奏，冲镜头挥挥手，「晚安呀，宝宝们。」","next":"msg1","variants":[{"minHp":4,"text":"「好啦，今天的直播就到这里。」她关掉伴奏，冲镜头挥挥手，「晚安呀，宝宝们。」\n关播前她又补了一句：「明天也来哦，我等你。」"}]},{"id":"msg1","scene":2,"spr":0,"who":"","text":"下播后，你正准备关掉手机，私信栏忽然跳出一个红点。\n头像是一轮细细的月亮。","next":"msg2"},{"id":"msg2","scene":2,"spr":0,"who":"","text":"是綾Lune：「今天谢谢你呀，还没睡吗？」","next":"msg3"},{"id":"msg3","scene":2,"spr":1,"who":"綾Lune","text":"你回了句\"睡不着\"。对面几乎秒回：「那正好，我也睡不着呢。陪我说说话，好不好？」","next":"c3","variants":[{"minHp":4,"text":"你回了句\"睡不着\"。对面几乎秒回：「那正好，我也睡不着呢。陪我说说话，好不好？」\n「其实我在等的人，好像一直都是你。」"},{"maxHp":1,"text":"你回了句\"睡不着\"。对面几乎秒回：「那正好，我也睡不着呢。陪我说说话，好不好？」\n对面安静了一会儿，才发来一句：「……要是不方便的话，也不用勉强。」"}]},{"id":"c3","scene":2,"spr":1,"who":"綾Lune","text":"「我啊……其实每天下播都睡不着呢。」她发来一条语音，背景里只有很轻的电流声，「灯一关，房间就好安静好安静，安静得吓人。」","choices":[{"text":"温柔地接住她的每一句话","hp":4,"next":"c3_a1"},{"text":"适当保持一点距离","hp":1,"next":"c3_b1"},{"text":"略带暧昧地试探一句","hp":3,"next":"c3_c1"}]},{"id":"c3_a1","scene":2,"spr":0,"who":"","text":"你一句一句地回她。她说直播间的压力，说那些没人听她唱歌的晚上，说肩头那只叫\"小蝠\"的黑蝙蝠。","next":"c3_a2"},{"id":"c3_a2","scene":2,"spr":1,"who":"綾Lune","text":"「其实我不太敢跟别人说这些的。」她打字打得很慢，「但是跟你说，好像没关系呢。」","next":"c3_a3"},{"id":"c3_a3","scene":2,"spr":1,"who":"綾Lune","text":"过了很久，她发来一句：「……你真好。」\n隔了几秒，又补上一句：「要是你能一直听我说话，就好了。」","next":"join3"},{"id":"c3_b1","scene":2,"spr":0,"who":"","text":"你回得不快不慢，斟酌着每一句话，连\"早点休息\"都写得客客气气。","next":"c3_b2"},{"id":"c3_b2","scene":2,"spr":1,"who":"綾Lune","text":"「……好呀，那不打扰你啦。」她回得很快，快得像是早就准备好了这句话。\n那个红点安静下去，像一盏被人关掉的灯。","next":"join3"},{"id":"c3_c1","scene":2,"spr":0,"who":"","text":"你半开玩笑地问：\"那我算不算你的特别观众？\"\n输入框上方\"对方正在输入\"亮了又灭，灭了又亮。","next":"c3_c2"},{"id":"c3_c2","scene":2,"spr":1,"who":"綾Lune","text":"「别、别撩我呀……」她发来一个慌乱的系统表情。\n过了一会儿，又补上一句：「……不过，我不讨厌呢。」","next":"join3"},{"id":"join3","scene":2,"spr":0,"who":"","text":"那天之后，你开始留意她开播的时间。\n像是有一根很细的线，把深夜的两端连在了一起。","next":"daily1","chapter":"第一幕 · 私信里的她"},{"id":"daily1","scene":1,"spr":1,"who":"","text":"之后的几个晚上，你几乎都准时出现。\n她开始在开播前给你发一句：「今天也来吗？」","next":"daily2"},{"id":"daily2","scene":2,"spr":1,"who":"綾Lune","text":"「要是哪天你没来……」某次下播后，她忽然说，「我可能会对着空直播间，唱一整晚呢。」\n她说完自己先笑了，但你看得出来，她不是在开玩笑。","next":"d0","variants":[{"minHp":8,"text":"「要是哪天你没来……」某次下播后，她忽然说，「我可能会对着空直播间，唱一整晚呢。」\n她说完自己先笑了，但你看得出来，她不是在开玩笑。\n她顿了顿，又发来一段语音，声音压得很低：「……所以你要是来，记得在弹幕里叫一声我的名字，好不好？」"},{"maxHp":4,"text":"「要是哪天你没来……」某次下播后，她忽然说，「我可能会对着空直播间，唱一整晚呢。」\n她说完自己先笑了，可那笑声很快就停住。「……算了，你就当我随便说说。」"}]},{"id":"d0","scene":2,"spr":0,"who":"","text":"几天后，她发来一条直播预告：周末想找个人连麦，一起唱几首歌。","next":"d1","chapter":"第二幕 · 连麦之夜"},{"id":"d1","scene":1,"spr":0,"who":"","text":"到了那晚，直播间的人比平时多得多。弹幕刷得飞快，她却一条也没有念。","next":"d1b","variants":[{"minHp":6,"text":"到了那晚，直播间的人比平时多得多。弹幕刷得飞快，她却一条也没有念。\n有人问她在等谁，她只是笑，没有回答。"},{"maxHp":3,"text":"到了那晚，直播间的人比平时多得多。弹幕刷得飞快，她念了几条，又很快放下手机。\n像是在确认某个名字有没有出现。"}]},{"id":"d1b","scene":1,"spr":0,"who":"","text":"你在私信里看见她发来两个字：「你来吗？」后面跟着一个小小的月亮表情。","next":"d2"},{"id":"d2","scene":1,"spr":1,"who":"綾Lune","text":"「不着急哦，我等你。」她嘴上这么说，尾音却越拖越短，「要是……你不想来，也没关系的啦。」","next":"c4","variants":[{"minHp":6,"text":"「不着急哦，我等你。」她嘴上这么说，尾音却越拖越短，「要是……你不想来，也没关系的啦。」\n她说完又立刻补一句：「啊、我不是在催你哦！真的！」"},{"maxHp":3,"text":"「不着急哦，我等你。」她嘴上这么说，尾音却越拖越短，「要是……你不想来，也没关系的啦。」\n那句“没关系的啦”后面，隔了很久才跟上一个句号。"}]},{"id":"c4","scene":1,"spr":1,"who":"綾Lune","text     setScene(0);
    showTitle();
  }

  btnStart.addEventListener('click', newGame);
  btnReset.addEventListener('click', newGame);
  btnContinue.addEventListener('click', continueGame);
  btnHome.addEventListener('click', function () { returnToTitle(true); });
  btnAfter.addEventListener('click', function () {
    var show = !endEpilogue.classList.contains('show');
    endEpilogue.classList.toggle('show', show);
    btnAfter.textContent = show ? '收 起 后 日 谈' : '后 日 谈';
  });
  btnAgain.addEventListener('click', newGame);

  /* ================= 章节过场 / CG / 引导 / 全屏 / 重置 ================= */
  function hideChapter() { if (chapterCard) chapterCard.classList.remove('show'); }
  function setCG(src) {
    if (!cgLayer) return;
    if (src) {
      if (cgLayer.getAttribute('src') !== src) cgLayer.src = src;
      cgLayer.classList.add('on');
      stage.classList.add('cg-mode');
      markCG(String(src).replace(/^assets\//, '').replace(/\.jpg$/, ''));
    } else {
      cgLayer.classList.remove('on');
      stage.classList.remove('cg-mode');
    }
  }
  function showReaction(delta) {
    if (!reactionEl) return;
    var key = 'lune-01.webp';
    if (delta >= 3) key = 'emoji_laugh.webp';
    else if (delta === 2) key = 'emoji_shy.webp';
    else if (delta === 1) key = 'emoji_tongue.webp';
    else key = 'emoji_dark.webp';
    reactionEl.src = 'assets/' + key;
    reactionEl.classList.add('show');
    clearTimeout(reactionEl._t);
    reactionEl._t = setTimeout(function () { reactionEl.classList.remove('show'); }, 1600);
  }
  function showChapter(title) {
    if (!chapterCard || !title) return;
    chapterText.textContent = title;
    chapterCard.classList.add('show');
    clearTimeout(chapterCard._t);
    chapterCard._t = setTimeout(function () { chapterCard.classList.remove('show'); }, 2400);
  }
  function markCG(key) {
    if (!key || cgUnlocked[key]) return;
    cgUnlocked[key] = true;
    try { localStorage.setItem(CG_KEY, JSON.stringify(cgUnlocked)); } catch (e) {}
  }
  function renderCG() {
    cgGrid.textContent = '';
    cgBigWrap.style.display = 'none';
    for (var i = 0; i < CG_ITEMS.length; i++) {
      (function (item) {
        var unlockedItem = !!item.emoji || !!cgUnlocked[item.id];
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'cg-item' + (unlockedItem ? '' : ' locked') + (item.emoji ? ' emoji' : '');
        var im = document.createElement('img'); im.src = item.src; im.alt = item.name;
        b.appendChild(im);
        var cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = item.name; b.appendChild(cap);
        if (unlockedItem) {
          b.addEventListener('click', function () {
            cgBigWrap.textContent = '';
            var big = document.createElement('img'); big.src = item.src; big.alt = item.name;
            cgBigWrap.appendChild(big);
            var cap = document.createElement('div'); cap.className = 'cg-cap'; cap.textContent = item.name;
            cgBigWrap.appendChild(cap);
            cgBigWrap.style.display = 'block';
          });
        }
        cgGrid.appendChild(b);
      })(CG_ITEMS[i]);
    }
  }
  function openCG() { renderCG(); openModal(cgModal, 'cg'); }
  var TIPS_KEY = 'lune_galgame_v3_tips';
  function maybeShowTips() {
    try { if (localStorage.getItem(TIPS_KEY)) return; localStorage.setItem(TIPS_KEY, '1'); } catch (e) {}
    var seq = [[700, '点击屏幕推进剧情'], [3800, '遇到选项时，点一下选项'], [7000, '右上角 ☰ 可以存档 / 设置 / 自动播放']];
    for (var i = 0; i < seq.length; i++) {
      (function (s) { setTimeout(function () { if (!titleVisible && !state.ended) showHint(s[1]); }, s[0]); })(seq[i]);
    }
  }
  function toggleFullscreen() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { fn.call(el); toast('已进入全屏'); } else toast('当前环境不支持全屏');
      } else {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if (ex) { ex.call(document); toast('已退出全屏'); }
      }
    } catch (e) { toast('当前环境不支持全屏'); }
  }
  var resetPending = false, resetTimer = null;
  function resetProgress() {
    if (!resetPending) {
      resetPending = true;
      toast('再次点击「重置进度」确认清除存档 / 结局 / 回忆');
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function () { resetPending = false; }, 4000);
      return;
    }
    resetPending = false;
    try {
      localStorage.removeItem(KEY); localStorage.removeItem(ENDINGS_KEY); localStorage.removeItem(CG_KEY); localStorage.removeItem(TIPS_KEY);
      for (var i = 0; i < 3; i++) localStorage.removeItem(SLOT_PREFIX + i);
    } catch (e) {}
    unlocked = {}; cgUnlocked = {};
    updateCollectCounts();
    toast('进度已重置');
    setTimeout(function () { try { location.reload(); } catch (e) {} }, 700);
  }
  function epiFor(e, hp) {
    if (!e) return '';
    if (e.epiHigh && typeof hp === 'number' && hp >= (typeof e.epiHighHp === 'number' ? e.epiHighHp : 12)) return e.epiHigh;
    return e.epilogue || '';
  }

  /* ================= 设置 / 自动 / 回看 / 存档槽 / 结局收集 ================= */
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }
  function pad2(n) { return ('0' + n).slice(-2); }
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ v: 3, speed: settings.speed, autoDelay: settings.autoDelay, seVolume: settings.seVolume, bgmVolume: settings.bgmVolume })); } catch (e) {}
  }
  function applySettingsToUI() {
    if (selSpeed) selSpeed.value = settings.speed;
    if (selAuto) selAuto.value = String(settings.autoDelay);
    if (rngSE) rngSE.value = String(settings.seVolume);
    if (rngBGM) rngBGM.value = String(settings.bgmVolume);
    applyVolume(); setAutoUI();
  }
  function setAutoUI() {
    btnAuto.textContent = settings.auto ? '自动播放：开' : '自动播放：关';
    menuBtn.classList.toggle('auto', !!settings.auto);
  }
  function cancelAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; } }
  function canAuto() {
    return settings.auto && gameActive && !state.ended && !state.transitioning && !modalOpen && !state.typing && !state.choosing && cont.classList.contains('show');
  }
  function scheduleAuto() {
    cancelAuto();
    if (!settings.auto) return;
    autoTimer = setTimeout(function () {
      autoTimer = null;
      if (!canAuto()) return;
      advance();
    }, Math.max(400, settings.autoDelay));
  }
  function toggleAuto() {
    settings.auto = !settings.auto;
    setAutoUI();
    if (settings.auto) { scheduleAuto(); toast('自动播放已开启'); }
    else { cancelAuto(); toast('自动播放已关闭'); }
  }
  function focusFirst(el) {
    try {
      var f = el.querySelector('button, select, input, [tabindex]');
      if (f) setTimeout(function () { try { f.focus(); } catch (e) {} }, 40);
    } catch (e) {}
  }
  function openModal(el, id) {
    try { lastFocused = document.activeElement; } catch (e) {}
    closeModals();
    modalOpen = id;
    if (el) { el.classList.add('show'); focusFirst(el); }
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'true');
    cancelAuto();
  }
  function closeModals() {
    modalOpen = null;
    var list = [menuModal, historyModal, slotModal, endingsModal, recallModal, cgModal];
    for (var i = 0; i < list.length; i++) if (list[i]) list[i].classList.remove('show');
    if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    try {
      if (lastFocused && lastFocused.focus && document.contains(lastFocused)) { lastFocused.focus(); }
      else if (gameActive && !state.ended && menuBtn) { menuBtn.focus(); }
    } catch (e) {}
    lastFocused = null;
    if (gameActive && !state.ended) scheduleAuto();
  }
  function openMenu() { if (!gameActive || state.ended) return; openModal(menuModal, 'menu'); }
  function activeModalEl() {
    if (modalOpen === 'menu') return menuModal;
    if (modalOpen === 'history') return historyModal;
    if (modalOpen === 'slot') return slotModal;
    if (modalOpen === 'endings') return endingsModal;
    if (modalOpen === 'recall') return recallModal;
    if (modalOpen === 'cg') return cgModal;
    return null;
  }
  function renderHistory() {
    histList.textContent = '';
    if (!history.length) {
      var d = document.createElement('div'); d.className = 'hist-empty'; d.textContent = '还没有回看记录。'; histList.appendChild(d); return;
    }
    for (var i = 0; i < history.length; i++) {
      var h = history[i];
      var row = document.createElement('div');
      row.className = 'hist-line' + (h.choice ? ' hist-choice' : '');
      var b = document.createElement('b');
      var p = document.createElement('p');
      if (h.choice) { b.textContent = '你的选择'; p.textContent = '▸ ' + h.choice; }
      else { b.textContent = h.who || '旁白'; p.textContent = h.text; }
      row.appendChild(b); row.appendChild(p);
      histList.appendChild(row);
    }
  }
  function openHistory() { renderHistory(); openModal(historyModal, 'history'); setTimeout(function () { histList.scrollTop = histList.scrollHeight; }, 30); }
  function formatTs(ts) {
    try { var d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); } catch (e) { return ''; }
  }
  function slotKey(i) { return SLOT_PREFIX + i; }
  function getSlot(i) {
    try {
      var s = JSON.parse(localStorage.getItem(slotKey(i)) || 'null');
      if (s && s.v === 3 && s.node && (s.node === '__ending__' || MAP[s.node])) return s;
    } catch (e) {}
    return null;
  }
  function hasAnySlot() { return !!(getSlot(0) || getSlot(1) || getSlot(2)); }
  function nodeLabel(nodeId) {
    var n = MAP[nodeId];
    if (!n || !n.text) return '未知进度';
    var s = n.text.split(String.fromCharCode(10)).join(' ');
    return s.length > 22 ? s.slice(0, 22) + '…' : s;
  }
  function saveToSlot(i) {
    if (!gameActive || state.ended) { toast('当前不可存档'); return; }
    var data = { v: 3, node: state.node, hp: state.hp, route: state.route, ts: Date.now(), label: nodeLabel(state.node) };
    try { localStorage.setItem(slotKey(i), JSON.stringify(data)); toast('已存入第 ' + (i + 1) + ' 槽'); }
    catch (e) { toast('存档失败'); }
    renderSlots('save');
    updateTitleButtons();
  }
  function loadFromSlot(i) {
    var sv = getSlot(i);
    if (!sv) { toast('该槽为空'); return; }
    state = { node: sv.node, hp: sv.hp || 0, route: sv.route || null, ended: false, choosing: false, typing: false, transitioning: false };
    history = [];
    resetUiForGame();
    hideTitle();
    gameActive = true;
    closeModals();
    renderNode();
    toast('已读取第 ' + (i + 1) + ' 槽');
  }
  function renderSlots(mode) {
    slotTitle.textContent = mode === 'save' ? '存 档' : '读 档';
    slotList.textContent = '';
    for (var i = 0; i < 3; i++) {
      (function (idx) {
        var sv = getSlot(idx);
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'slot' + (sv ? '' : ' empty');
        var t1 = document.createElement('b');
        t1.textContent = '第 ' + (idx + 1) + ' 槽' + (sv ? '' : ' · 空');
        b.appendChild(t1);
        var t2 = document.createElement('span');
        if (sv) t2.textContent = sv.label + String.fromCharCode(10) + '好感 ' + (sv.hp || 0) + ' · ' + formatTs(sv.ts) + ' · 点击' + (mode === 'save' ? '覆盖存档' : '读取');
        else t2.textContent = mode === 'save' ? '点击存入当前进度' : '（空存档）';
        b.appendChild(t2);
        b.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (mode === 'save') saveToSlot(idx); else loadFromSlot(idx);
        });
        slotList.appendChild(b);
      })(i);
    }
  }
  function openSlotModal(mode) { renderSlots(mode); openModal(slotModal, 'slot'); }
  function unlockEnding(key, hp) {
    if (!key) return false;
    if (unlocked[key]) return false;
    unlocked[key] = { hp: (typeof hp === 'number' ? hp : null), ts: Date.now() };
    try { localStorage.setItem(ENDINGS_KEY, JSON.stringify(unlocked)); } catch (e) {}
    return true;
  }
  function unlockedHp(key) {
    var u = unlocked[key];
    return (u && typeof u === 'object' && typeof u.hp === 'number') ? u.hp : null;
  }
  function countUnlocked() {
    var n = 0;
    for (var k in ENDINGS) if (Object.prototype.hasOwnProperty.call(ENDINGS, k) && unlocked[k]) n++;
    return n;
  }
  function updateCollectCounts() {
    var n = countUnlocked(), txt = '结局收集 ' + n + '/5';
    if (btnEndings) btnEndings.textContent = txt;
    if (btnEndingsTitle) btnEndingsTitle.textContent = txt;
    if (endCollectCount) endCollectCount.textContent = n + '/5';
  }
  function renderEndingsList() {
    endingsList.textContent = '';
    var order = ['he_own', 'he_talk', 'ne_gray', 'ne_miss', 'be_cage'];
    for (var i = 0; i < order.length; i++) {
      (function (key) {
        var e = ENDINGS[key];
        var row = document.createElement('div');
        row.className = 'slot' + (unlocked[key] ? '' : ' empty');
        var t1 = document.createElement('b');
        t1.textContent = unlocked[key] ? (e.tag + ' · ' + e.title) : '？？？ · 未解锁';
        row.appendChild(t1);
        var t2 = document.createElement('span');
        var epiText = epiFor(e, unlockedHp(key));
        t2.textContent = unlocked[key] ? ((e.text || '') + (epiText ? String.fromCharCode(10, 10) + '【后日谈】' + String.fromCharCode(10) + epiText : '')) : '在剧情中做出相应选择即可解锁。';
        row.appendChild(t2);
        if (unlocked[key]) {
          var hint = document.createElement('span');
          hint.className = 'recall-hint';
          hint.textContent = '点击回看 →';
          row.appendChild(hint);
          row.addEventListener('click', function () { showRecall(e, unlockedHp(key)); });
        }
        endingsList.appendChild(row);
      })(order[i]);
    }
  }
  function showRecall(e, hp) {
    recallTag.textContent = e.tag || '';
    recallTitle.textContent = e.title || '';
    recallText.textContent = e.text || '';
    var epiText = epiFor(e, hp);
    recallEpi.textContent = epiText;
    recallEpi.classList.toggle('show', !!epiText);
    openModal(recallModal, 'recall');
  }
  function openEndingsModal() { renderEndingsList(); openModal(endingsModal, 'endings'); }

  menuBtn.addEventListener('click', function (ev) { ev.stopPropagation(); openMenu(); });
  btnCloseMenu.addEventListener('click', closeModals);
  btnCloseHistory.addEventListener('click', closeModals);
  btnCloseSlot.addEventListener('click', closeModals);
  btnCloseEndings.addEventListener('click', closeModals);
  btnCloseRecall.addEventListener('click', closeModals);
  btnAuto.addEventListener('click', function () { toggleAuto(); });
  btnHistory.addEventListener('click', function () { openHistory(); });
  btnSaveSlot.addEventListener('click', function () { openSlotModal('save'); });
  btnLoadSlot.addEventListener('click', function () { openSlotModal('load'); });
  btnEndings.addEventListener('click', openEndingsModal);
  btnMenuTitle.addEventListener('click', function () { closeModals(); returnToTitle(false); });
  btnLoadTitle.addEventListener('click', function () { openSlotModal('load'); });
  if (btnCG) btnCG.addEventListener('click', openCG);
  if (btnCGTitle) btnCGTitle.addEventListener('click', openCG);
  if (btnFullscreen) btnFullscreen.addEventListener('click', toggleFullscreen);
  if (btnResetProgress) btnResetProgress.addEventListener('click', resetProgress);
  if (btnCloseCG) btnCloseCG.addEventListener('click', closeModals);
  btnEndingsTitle.addEventListener('click', openEndingsModal);
  selSpeed.addEventListener('change', function () { settings.speed = selSpeed.value; saveSettings(); toast('文字速度：' + selSpeed.options[selSpeed.selectedIndex].text); });
  selAuto.addEventListener('change', function () { settings.autoDelay = parseInt(selAuto.value, 10) || 2200; saveSettings(); toast('自动间隔已更新'); if (settings.auto) scheduleAuto(); });
  rngSE.addEventListener('input', function () { settings.seVolume = parseInt(rngSE.value, 10) || 0; applyVolume(); });
  rngSE.addEventListener('change', function () { saveSettings(); });
  rngBGM.addEventListener('input', function () { settings.bgmVolume = parseInt(rngBGM.value, 10) || 0; applyVolume(); });
  rngBGM.addEventListener('change', function () { saveSettings(); });
  [menuModal, historyModal, slotModal, endingsModal, recallModal, cgModal].forEach(function (m) {
    m.addEventListener('click', function (ev) { if (ev.target === m) closeModals(); });
  });

  /* ================= 启动 ================= */
  (function boot() {
    // story data sanity
    if (!STORY || !STORY.length || !MAP['start']) {
      textEl.textContent = '剧情数据加载失败。';
      return;
    }
    try { soundOn = localStorage.getItem(SKEY) === '1'; } catch (e) {}
    try {
      var stg = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (stg && stg.v === 3) {
        settings.speed = stg.speed || 'normal';
        settings.autoDelay = stg.autoDelay || 2200;
        settings.seVolume = (typeof stg.seVolume === 'number') ? stg.seVolume : ((typeof stg.volume === 'number') ? stg.volume : 70);
        settings.bgmVolume = (typeof stg.bgmVolume === 'number') ? stg.bgmVolume : 35;
      }
    } catch (e) {}
    try { unlocked = JSON.parse(localStorage.getItem(ENDINGS_KEY) || '{}') || {}; } catch (e) { unlocked = {}; }
    try { cgUnlocked = JSON.parse(localStorage.getItem(CG_KEY) || '{}') || {}; } catch (e) { cgUnlocked = {}; }
    try {
      if (!localStorage.getItem(KEY)) {
        var oldSave = JSON.parse(localStorage.getItem('lune_galgame_v2_save') || 'null');
        if (oldSave && oldSave.v === 2) { oldSave.v = 3; localStorage.setItem(KEY, JSON.stringify(oldSave)); }
      }
    } catch (e) {}
    updateSoundUI();
    applySettingsToUI();
    updateCollectCounts();
    updateTitleButtons();
    setScene(0);
    // 首次交互时恢复音效
    if (soundOn) {
      document.addEventListener('pointerdown', function once() {
        document.removeEventListener('pointerdown', once);
        try { ac(); startAmbient(); } catch (e) {}
      });
    }
    // 暴露给自动化测试/调试
    window.LUNE_DEBUG = {
      getState: function () { return state; },
      getSettings: function () { return settings; },
      getUnlocked: function () { return unlocked; },
      getHistory: function () { return history; },
      getAudio: function () { return { soundOn: soundOn, bgmMode: bgm.mode, bgmVolume: settings.bgmVolume, seVolume: settings.seVolume }; },
      getCG: function () { return cgUnlocked; },
      getChapter: function () { return state.chapter; },
      story: STORY, endings: ENDINGS, map: MAP
    };
  })();
})();
</script>
</body>
</html>
